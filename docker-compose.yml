services:
  horizon:
    build:
      context: .
      # args:
      #   EXTRAS: trafilatura  # comma-separated optional extras, e.g. "trafilatura,openbb"
    container_name: horizon
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
    restart: "no"
    # Hardening: read-only code, no root powers, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Run daily at 8:00 AM UTC (adjust as needed)
    # For one-time run, use: docker compose run --rm horizon
    command: ["--hours", "24"]

  # Local read-only web viewer for data/summaries: docker compose up viewer
  viewer:
    build: .
    entrypoint: ["/app/.venv/bin/python", "-m", "src.viewer"]
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"  # localhost only, not reachable from your network
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
